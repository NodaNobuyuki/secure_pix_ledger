spring.application.name=secure-pix-ledger

# Connection settings come from the environment; no credentials live in the repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank}
spring.datasource.username=${DB_USERNAME:bank}
spring.datasource.password=${DB_PASSWORD:}
# A transfer waiting on a locked account (or on a racing idempotency key) fails after 3 s instead of
# holding a pooled connection indefinitely (ADR-0007). Set on every new connection in the pool.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keeping the session open during view rendering hides lazy-loading bugs and holds DB connections longer.
spring.jpa.open-in-view=false

# Actuator listens on its own port so health/metrics are never served alongside the public API.
# In docker compose this port is not published; only Prometheus reaches it on the internal network.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus

# Strict JSON for money (ADR-0011): unknown fields are an error (no mass assignment), and numbers
# are never coerced, so 1.5 is not truncated to 1 and "100" is not parsed as 100.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# API docs. Shorter path than the springdoc default; the JSON spec stays at /v3/api-docs.
# Phase 2 revisits whether docs stay public once authentication exists.
springdoc.swagger-ui.path=/swagger-ui
