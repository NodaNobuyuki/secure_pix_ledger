name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run picks up newly added CodeQL queries even without code changes.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          # A real build gives CodeQL full type information, so data-flow (taint) analysis is more precise.
          build-mode: manual
          queries: security-extended

      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:java-kotlin"
          output: sarif-results

      # The analyze step only reports; this makes any finding fail the pipeline, as the brief requires.
      # Accepted findings are listed as [rule, path prefix], each justified in ADR-0003.
      - name: Fail on findings
        run: |
          jq -s '
            [["java/insufficient-key-size", "src/test/"],
             ["java/spring-disabled-csrf-protection",
              "src/main/java/dev/carlosnobuyuki/bank/infrastructure/security/SecurityConfig.java"]]
              as $accepted
            | [.[].runs[].results[]
                | .ruleId as $rule
                | .locations[0].physicalLocation.artifactLocation.uri as $uri
                | select(any($accepted[]; . as [$accepted_rule, $prefix]
                    | $rule == $accepted_rule and ($uri | startswith($prefix))) | not)]' \
            sarif-results/*.sarif > findings.json
          if [ "$(jq length findings.json)" -gt 0 ]; then
            jq -r '.[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' findings.json
            exit 1
          fi
          echo "No CodeQL findings."
