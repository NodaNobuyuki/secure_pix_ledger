# Local stack: API + PostgreSQL (+ one-shot migrations) + Prometheus + Grafana.
# Host ports bind to 127.0.0.1 only, so nothing is reachable from the LAN.
# `${VAR:?}` makes compose refuse to start when .env is missing a secret, instead of
# silently falling back to a weak default.

name: secure-pix-ledger

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The role the app connects as, created by the init script below (ADR-0012).
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is first created.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP on purpose: on first boot the image runs init scripts on a temporary server that
      # listens only on the Unix socket, so a socket check reports healthy before migrate can
      # connect over the network.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the migrations as the schema owner, then exits. Only this one-shot container gets the
  # owner credentials (ADR-0012). Keep the tag equal to the flyway.version Spring Boot manages.
  migrate:
    image: flyway/flyway:12.4.0-alpine
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    command: ["-placeholders.app_role=${APP_DB_USER}", "migrate"]
    volumes:
      - ./src/main/resources/db/migration:/flyway/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      # Least-privilege role: rows only, no DDL, no DELETE (ADR-0012).
      DB_USERNAME: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      # The migrate service already ran; the app has no rights to migrate anyway.
      SPRING_FLYWAY_ENABLED: "false"
      # "default" is Spring's name for "no profile". Set SPRING_PROFILES_ACTIVE=dev in .env to
      # seed funded demo accounts; nothing else changes between the two.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # Access token signing keys (ADR-0014), mounted from the secrets below.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
    secrets:
      - jwt_private_key
      - jwt_public_key
    ports:
      # Only the public API port is published. The management port (8081: health,
      # metrics) stays on the internal compose network, reachable by Prometheus only.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

# Written by ops/scripts/generate-jwt-keys.sh. If a file is missing, the app container does not
# start: there is no fallback key (ADR-0014).
secrets:
  jwt_private_key:
    file: ./secrets/jwt-private.pem
  jwt_public_key:
    file: ./secrets/jwt-public.pem

volumes:
  pgdata:
  promdata:
  grafanadata:
